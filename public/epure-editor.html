<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Épure — plans, coupes et 3D</title>
<script type="module">import * as THREE_NS from "/vendor/three.module.min.js"; window.THREE = THREE_NS;</script>
<style>
:root{
  --paper:#EEF0EC; --grid:#DDE1DB; --grid2:#C8CDC5;
  --ink:#23282E; --ink2:#5A6068; --ink3:#9AA0A8;
  --accent:#1F5FCB; --accent-soft:#DFE8FA;
  --panel:#FBFBFA; --line:#D8DBD5; --danger:#B3402F;
  --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--font);color:var(--ink);background:var(--panel);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

header{display:flex;align-items:center;gap:14px;height:46px;padding:0 12px;border-bottom:1px solid var(--line);background:#fff;flex:none}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-weight:400;color:var(--ink2);margin-left:8px;font-size:12px}
.tabs{display:flex;gap:2px;background:#EDEEEA;border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:5px 14px;border-radius:5px;font-weight:500;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.spacer{flex:1}
.hb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.hb:hover{background:#F3F4F1}
.hb:disabled{color:var(--ink3);cursor:default;background:#fff}
.hb svg{width:15px;height:15px}

main{flex:1;display:flex;min-height:0}
.rail{width:150px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;padding:8px 6px;gap:2px;overflow-y:auto}
.rail button{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:7px 8px;border-radius:6px;text-align:left;width:100%;color:var(--ink)}
.rail button:hover{background:#F3F4F1}
.rail button.on{background:var(--accent-soft);color:var(--accent)}
.rail button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button .k{margin-left:auto;font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:14px}
.rail button.on .k{color:var(--accent);border-color:#B7C9F0}
.rail .sep{height:1px;background:var(--line);margin:6px 4px}
.rail .tick{width:14px;height:14px;border:1px solid var(--ink3);border-radius:3px;flex:none;position:relative}
.rail button small{margin-left:auto;font-size:10px;color:var(--ink3)}
.rail button.on .tick{background:var(--accent);border-color:var(--accent)}
.rail button.on .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rail h4{margin:8px 8px 4px;font-size:11px;font-weight:600;color:var(--ink2)}

.stage{flex:1;position:relative;min-width:0;background:var(--paper);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#c3d-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;max-width:360px;display:none}
.badge{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--ink2);pointer-events:none}

.side{width:270px;flex:none;border-left:1px solid var(--line);background:#fff;overflow-y:auto;padding:6px 14px 28px}
.side h3{font-size:12px;font-weight:600;color:var(--ink2);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.side h3:first-child{margin-top:8px}
.side p{margin:6px 0;color:var(--ink2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
.row label{color:var(--ink2);flex:1}
.row .in{display:flex;align-items:center;gap:4px}
.row input[type=number],.row select{width:96px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff}
.row input[type=number]{text-align:right}
.row .u{color:var(--ink3);width:22px;font-size:12px}
.row input[type=range]{width:100%}
.row input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.sb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;width:100%;margin:4px 0;text-align:left}
.sb:hover{background:#F3F4F1}
.sb.danger{color:var(--danger);border-color:#E2C4BE}
.sb.danger:hover{background:#FBF1EF}
.two{display:flex;gap:6px}
.two .sb{flex:1;text-align:center}
.kv{display:flex;justify-content:space-between;color:var(--ink2);margin:3px 0}
.kv b{color:var(--ink);font-weight:500}

footer{height:28px;flex:none;border-top:1px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 12px;gap:18px;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden}
footer .msg{flex:1;overflow:hidden;text-overflow:ellipsis}
footer .msg.alert{color:var(--danger)}

@media (max-width:900px){
  .rail{width:46px;padding:6px 4px}
  .rail button{padding:7px}
  .rail button span,.rail button .k,.rail h4{display:none}
  .side{width:230px;padding:6px 10px 28px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .tabs button,.rail button,.hb,.sb{transition:background-color .12s}
}
</style>

<body>
<header>
  <div class="brand">Épure<span>plans · coupes · 3D</span></div>
  <div class="tabs" role="tablist">
    <button data-view="plan" class="on" role="tab">Plan</button>
    <button data-view="section" role="tab">Coupe</button>
    <button data-view="3d" role="tab">3D</button>
  </div>
  <div class="spacer"></div><button class="hb" id="btn-plans" title="Retour aux plans">Mes plans</button>
  <button class="hb" id="btn-undo" title="Annuler (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Annuler</button>
  <button class="hb" id="btn-redo" title="Rétablir (Ctrl+Y)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>Rétablir</button>

<main>
  <nav class="rail" id="rail"></nav>

</main>
<footer><div class="msg" id="msg"></div><div id="coords"></div><div id="zoom"></div></footer>

<script type="module">
'use strict';
/* ================= Utilitaires ================= */
const C = { paper:'#EEF0EC', grid:'#DDE1DB', grid2:'#C8CDC5', ink:'#23282E', ink2:'#5A6068', ink3:'#9AA0A8',
  wall:'#3B4047', accent:'#1F5FCB', danger:'#B3402F', wood:'#7A5636', glass:'#4F8FBF' };
const OPEN_MARGIN = 10;      // distance mini d'une ouverture à l'extrémité d'un mur (cm)
const FILL_T = 20;           // épaisseur des remplissages de pignon (cm)
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const deg = d => d * Math.PI / 180;
const fmtM = cm => (Math.round(cm) / 100).toFixed(2).replace('.', ',') + ' m';
const fmtLevel = cm => (cm >= 0 ? '+' : '−') + (Math.abs(Math.round(cm)) / 100).toFixed(2).replace('.', ',');
let idSeq = 1; const uid = () => idSeq++;
const num = (v, d) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : d; };

/* ================= État ================= */
const state = {
  walls: [], openings: [], dims: [], section: null, furniture: [],
  roof: { type: 'gable', pitch: 30, orient: 0, overhang: 40, thick: 20 },
  cladding: { primary: 'wood', secondary: 'metal', metalPercent: 0, orientation: 'vertical', woodColor: '#7A5636', metalColor: '#20242A', zones: 'all' },
  defaults: { wallH: 270, wallT: 20, doorW: 90, doorH: 210, winW: 120, winH: 120, winSill: 90 },
  grid: 10, showWallDims: true
};
const ui = { view: 'plan', tool: 'select', selected: null, showBeyond: true, roofVisible: true, clip3D: false, msg: '', alert: false };

const history = { undo: [], redo: [] };
function snapshot() { return JSON.stringify({ walls: state.walls, openings: state.openings, dims: state.dims, section: state.section, roof: state.roof, furniture: state.furniture, cladding: state.cladding }); }
function pushHistory() { history.undo.push(snapshot()); if (history.undo.length > 120) history.undo.shift(); history.redo.length = 0; updateHistoryButtons(); }
function restore(json) {
  const o = JSON.parse(json);
  state.walls = o.walls || []; state.openings = o.openings || []; state.dims = o.dims || []; state.section = o.section || null; state.roof = o.roof || state.roof; state.furniture = o.furniture || []; state.cladding = o.cladding || state.cladding;
  fixIds(); ui.selected = null; changed();
}
function undo() { if (!history.undo.length) return; history.redo.push(snapshot()); restore(history.undo.pop()); updateHistoryButtons(); setMsg('Annulé'); }
function redo() { if (!history.redo.length) return; history.undo.push(snapshot()); restore(history.redo.pop()); updateHistoryButtons(); setMsg('Rétabli'); }
function fixIds() { let m = 0; for (const a of [state.walls, state.openings, state.dims, state.furniture]) for (const o of a) m = Math.max(m, o.id || 0); idSeq = m + 1; }
function updateHistoryButtons() { $('#btn-undo').disabled = !history.undo.length; $('#btn-redo').disabled = !history.redo.length; }

const wallById = id => state.walls.find(w => w.id === id);
const openingsOf = w => state.openings.filter(o => o.wall === w.id).sort((a, b) => a.off - b.off);


/* ================= Mobilier & équipements ================= */
const FURNITURE_CATALOG = {
  kitchen_base: { label:'Meuble bas', group:'Cuisine', w:60, h:60, z:90, color:'#D7D1C4' },
  kitchen_upper: { label:'Meuble haut', group:'Cuisine', w:60, h:35, z:80, color:'#C9C1B2' },
  kitchen_island: { label:'Îlot', group:'Cuisine', w:180, h:90, z:92, color:'#D7D1C4' },
  fridge: { label:'Frigo', group:'Cuisine', w:70, h:70, z:190, color:'#D8E1E8' },
  stove: { label:'Plaque/four', group:'Cuisine', w:60, h:60, z:90, color:'#2F3338' },
  sink: { label:'Évier', group:'Cuisine', w:80, h:60, z:90, color:'#BFCAD0' },
  dishwasher: { label:'Lave-vaisselle', group:'Cuisine', w:60, h:60, z:85, color:'#D8E1E8' },
  toilet: { label:'WC', group:'SDB', w:40, h:70, z:45, color:'#F5F3EC' },
  vanity: { label:'Vasque', group:'SDB', w:80, h:50, z:85, color:'#EFEADF' },
  shower: { label:'Douche', group:'SDB', w:90, h:90, z:210, color:'#CFE0EC' },
  bath: { label:'Baignoire', group:'SDB', w:170, h:75, z:58, color:'#F5F3EC' },
  washer: { label:'Lave-linge', group:'SDB', w:60, h:60, z:85, color:'#D8E1E8' },
  bed: { label:'Lit', group:'Chambre', w:160, h:200, z:55, color:'#D9C7B5' },
  sofa: { label:'Canapé', group:'Séjour', w:220, h:90, z:80, color:'#B9C0B5' },
  dining: { label:'Table repas', group:'Séjour', w:180, h:90, z:75, color:'#B98D62' },
  desk: { label:'Bureau', group:'Bureau', w:140, h:70, z:75, color:'#B98D62' },
  wardrobe: { label:'Placard', group:'Rangement', w:120, h:60, z:240, color:'#C9C1B2' },
  plant: { label:'Plante', group:'Déco', w:45, h:45, z:120, color:'#3F7D4C' }
};
const FURNITURE_TOOLS = Object.keys(FURNITURE_CATALOG);
function addFurniture(kind, p){ const f=FURNITURE_CATALOG[kind]; const o={ id:uid(), kind, x:p.x, y:p.y, w:f.w, h:f.h, rot:0, z:f.z, label:f.label, color:f.color }; state.furniture.push(o); return o; }
function furnitureRect(f){ const c=Math.cos(deg(f.rot||0)), s=Math.sin(deg(f.rot||0)), hw=f.w/2, hh=f.h/2; return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>({x:f.x+x*c-y*s,y:f.y+x*s+y*c})); }
function furnitureAt(p){ for(let i=state.furniture.length-1;i>=0;i--){ const f=state.furniture[i]; if(pointInPoly(p, furnitureRect(f))) return f; } return null; }
function nearestWallAngle(p){ const nw=nearestWall(p, 24/cam.s); if(!nw) return null; const d=wallDir(nw.w); return Math.atan2(d.dy,d.dx)*180/Math.PI; }
function drawFurniture(ctx,T){
  for(const f of state.furniture){ const spec=FURNITURE_CATALOG[f.kind]||{}; const pts=furnitureRect(f); pathPts(ctx,pts,T); ctx.fillStyle=f.color||spec.color||'#D7D1C4'; ctx.fill(); ctx.strokeStyle=C.ink2; ctx.lineWidth=1; ctx.stroke();
    const c=T({x:f.x,y:f.y}); ctx.font='10px '+FONT; ctx.fillStyle=C.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(f.label||spec.label||f.kind,c.x,c.y);
    if(ui.selected&&ui.selected.type==='furniture'&&ui.selected.id===f.id){ pathPts(ctx,pts,T); ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.stroke(); }
  }
}

/* ================= Géométrie des murs ================= */
function wallDir(w) { const dx = w.x2 - w.x1, dy = w.y2 - w.y1, L = Math.hypot(dx, dy); return L < 1e-9 ? { dx: 1, dy: 0, L: 0 } : { dx: dx / L, dy: dy / L, L }; }
const wallLen = w => Math.hypot(w.x2 - w.x1, w.y2 - w.y1);
function ptAlong(w, u, side) { const d = wallDir(w); const s = side || 0; return { x: w.x1 + d.dx * u - d.dy * s, y: w.y1 + d.dy * u + d.dx * s }; }
function lineInter(p, d, q, e) {
  const den = d.x * e.y - d.y * e.x; if (Math.abs(den) < 1e-9) return null;
  const s = ((q.x - p.x) * e.y - (q.y - p.y) * e.x) / den; return { x: p.x + d.x * s, y: p.y + d.y * s };
}
const keyPt = (x, y) => Math.round(x * 10) + ',' + Math.round(y * 10);
function junctions() {
  const j = new Map();
  for (const w of state.walls) for (const e of [0, 1]) {
    const k = keyPt(e ? w.x2 : w.x1, e ? w.y2 : w.y1);
    if (!j.has(k)) j.set(k, []); j.get(k).push({ w, e });
  }
  return j;
}
/* Polygones des murs (4 points : début+, fin+, fin−, début−) avec onglets aux angles entre exactement deux murs */
function computeWallPolys() {
  const junc = junctions(); const polys = new Map();
  for (const w of state.walls) {
    const d = wallDir(w); const n = { x: -d.dy, y: d.dx }; const ht = w.t / 2; const ends = [];
    for (const e of [0, 1]) {
      const P = e ? { x: w.x2, y: w.y2 } : { x: w.x1, y: w.y1 };
      let plus = { x: P.x + n.x * ht, y: P.y + n.y * ht }, minus = { x: P.x - n.x * ht, y: P.y - n.y * ht }, mitre = false;
      const list = junc.get(keyPt(P.x, P.y));
      if (list && list.length === 2) {
        const o = (list[0].w === w && list[0].e === e) ? list[1] : list[0];
        if (o.w !== w && wallLen(o.w) > 0.5 && d.L > 0.5) {
          const d1 = e ? { x: d.dx, y: d.dy } : { x: -d.dx, y: -d.dy };
          const od = wallDir(o.w); const d2 = o.e ? { x: -od.dx, y: -od.dy } : { x: od.dx, y: od.dy };
          const cross = d1.x * d2.y - d1.y * d2.x;
          if (Math.abs(cross) > 0.03) {
            const n1 = { x: -d1.y, y: d1.x }, n2 = { x: -d2.y, y: d2.x }, ht2 = o.w.t / 2;
            const L = lineInter({ x: P.x + n1.x * ht, y: P.y + n1.y * ht }, d1, { x: P.x + n2.x * ht2, y: P.y + n2.y * ht2 }, d2);
            const R = lineInter({ x: P.x - n1.x * ht, y: P.y - n1.y * ht }, d1, { x: P.x - n2.x * ht2, y: P.y - n2.y * ht2 }, d2);
            const maxM = Math.max(w.t, o.w.t) * 3;
            if (L && R && Math.hypot(L.x - P.x, L.y - P.y) < maxM && Math.hypot(R.x - P.x, R.y - P.y) < maxM) {
              if (e) { plus = L; minus = R; } else { plus = R; minus = L; }
              mitre = true;
            }
          }
        }
      }
      ends.push({ plus, minus, mitre });
    }
    polys.set(w.id, { pts: [ends[0].plus, ends[1].plus, ends[1].minus, ends[0].minus], mitre: [ends[0].mitre, ends[1].mitre] });
  }
  /* poteaux de raccord aux jonctions de 3 murs et plus */
  const posts = [];
  for (const [k, list] of junc) if (list.length >= 3) {
    const t = Math.max(...list.map(l => l.w.t)), h = Math.max(...list.map(l => l.w.h));
    const [x, y] = k.split(',').map(v => v / 10);
    posts.push({ x, y, t, h });
  }
  return { polys, posts };
}
/* Points (plan) d'un morceau de mur entre u0 et u1, en tenant compte des onglets aux extrémités */
function piecePts(w, poly, u0, u1) {
  const L = wallLen(w), ht = w.t / 2;
  const a0 = u0 <= 0.01 ? poly.pts[0] : ptAlong(w, u0, ht), a1 = u0 <= 0.01 ? poly.pts[3] : ptAlong(w, u0, -ht);
  const b0 = u1 >= L - 0.01 ? poly.pts[1] : ptAlong(w, u1, ht), b1 = u1 >= L - 0.01 ? poly.pts[2] : ptAlong(w, u1, -ht);
  return [a0, b0, b1, a1];
}
function wallsBBox() {
  if (!state.walls.length) return null;
  const { polys } = computeWallPolys(); let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const w of state.walls) for (const p of polys.get(w.id).pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
  return { minX, minY, maxX, maxY };
}
const maxWallH = () => state.walls.reduce((m, w) => Math.max(m, w.h), 0);

/* ================= Ouvertures ================= */
function openingFits(w, off, width, ignoreId) {
  const L = wallLen(w);
  if (off < OPEN_MARGIN - 0.01 || off + width > L - OPEN_MARGIN + 0.01) return false;
  for (const o of state.openings) if (o.wall === w.id && o.id !== ignoreId) { if (off < o.off + o.w + 1 && off + width > o.off - 1) return false; }
  return true;
}
function placeOpening(w, u, width, ignoreId) {
  const L = wallLen(w); if (L < width + 2 * OPEN_MARGIN) return null;
  const off = clamp(u - width / 2, OPEN_MARGIN, L - width - OPEN_MARGIN);
  return { off, valid: openingFits(w, off, width, ignoreId) };
}
function fixOpeningsOnWall(w) {
  const L = wallLen(w);
  state.openings = state.openings.filter(o => {
    if (o.wall !== w.id) return true;
    if (L < o.w + 2 * OPEN_MARGIN) return false;
    o.off = clamp(o.off, OPEN_MARGIN, L - o.w - OPEN_MARGIN);
    if (o.type === 'door') o.h = clamp(o.h, 20, w.h);
    else { o.h = clamp(o.h, 10, w.h); o.sill = clamp(o.sill, 0, w.h - o.h); }
    return true;
  });
}
function nearestWall(p, tolWorld) {
  let best = null, bd = Infinity;
  for (const w of state.walls) {
    const d = wallDir(w); if (d.L < 1) continue;
    const u = (p.x - w.x1) * d.dx + (p.y - w.y1) * d.dy; if (u < 0 || u > d.L) continue;
    const v = Math.abs(-(p.x - w.x1) * d.dy + (p.y - w.y1) * d.dx);
    if (v < w.t / 2 + tolWorld && v < bd) { bd = v; best = { w, u }; }
  }
  return best;
}

/* ================= Toit ================= */
/* Modèle géométrique commun au plan, à la coupe et à la 3D. Le toit couvre l'emprise rectangulaire des murs. */
function roofModel() {
  const bb = wallsBBox(); if (!bb) return null;
